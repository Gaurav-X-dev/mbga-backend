[project]
name = "mbga-backend"
version = "0.1.0"
description = "MBGA Order Management and Payment Reconciliation backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncmy>=0.2.9",
  "alembic>=1.13.2",
  "redis>=5.0.8",
  "pyjwt>=2.9.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: fast unit tests that do not require external services",
  "integration: tests that require external services",
  "mysql: tests that require a disposable MySQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
